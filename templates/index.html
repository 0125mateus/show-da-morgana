{% extends "base.html" %}

{% block title %}O Show da Morgana{% endblock %}

{% block body %}
<audio
  id="musica-festa"
  src="{{ url_for('static', filename='audio/eu-quero-saber.mp3') }}"
  loop
  preload="auto"
  playsinline
></audio>

<button
  type="button"
  class="audio-toggle"
  id="audioToggle"
  aria-pressed="false"
  aria-label="Silenciar"
  title="Silenciar"
>
  <span class="audio-toggle__icon audio-toggle__icon--muted" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5L6 9H3v6h3l5 4V5z"/>
      <line x1="23" y1="9" x2="17" y2="15"/>
      <line x1="17" y1="9" x2="23" y2="15"/>
    </svg>
  </span>
  <span class="audio-toggle__icon audio-toggle__icon--on" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5L6 9H3v6h3l5 4V5z"/>
      <path d="M19.07 4.93a10 10 0 010 14.14"/>
      <path d="M15.54 8.46a5 5 0 010 7.07"/>
    </svg>
  </span>
</button>

<main class="show-sign-page" id="inicio" aria-label="Letreiro do Show da Morgana">
  <div class="space-bg" aria-hidden="true">
    <div class="space-bg__stars space-bg__stars--far"></div>
    <div class="space-bg__stars space-bg__stars--near"></div>
    <div class="space-bg__nebula space-bg__nebula--a"></div>
    <div class="space-bg__nebula space-bg__nebula--b"></div>
    <div class="space-bg__planet space-bg__planet--blue"></div>
    <div class="space-bg__planet space-bg__planet--ring"></div>
    <div class="space-bg__planet space-bg__planet--red"></div>
    <div class="space-bg__planet space-bg__planet--small"></div>
    <div class="space-bg__moon"></div>
    <div class="space-bg__comet space-bg__comet--1"></div>
    <div class="space-bg__comet space-bg__comet--2"></div>
  </div>

  {% include "components/show-sign.html" %}

  <p class="show-sign-page__lead">
    Eu quero saber… se você vem comemorar comigo!
  </p>

  <div class="show-sign-page__cta cta-row">
    <a class="btn btn--primary" href="{{ url_for('pagina_confirmar') }}">Confirmar presença</a>
  </div>
</main>

<script>
  (function () {
    var audio = document.getElementById("musica-festa");
    var btn = document.getElementById("audioToggle");
    if (!audio || !btn) return;

    var volumeAlvo = 0.7;
    var somLigado = true; /* começa “ativado”; se o navegador bloquear, ajusta */

    function atualizarBotao() {
      btn.classList.toggle("is-muted", !somLigado);
      btn.setAttribute("aria-pressed", somLigado ? "false" : "true");
      btn.setAttribute("aria-label", somLigado ? "Silenciar" : "Ativar som");
      btn.title = somLigado ? "Silenciar" : "Ativar som";
    }

    function tocarMudo() {
      audio.muted = true;
      audio.volume = volumeAlvo;
      var p = audio.play();
      if (p && p.catch) p.catch(function () {});
    }

    function ligarSom() {
      audio.muted = false;
      audio.volume = volumeAlvo;
      var p = audio.play();
      if (p && p.then) {
        return p.then(function () {
          somLigado = true;
          atualizarBotao();
          return true;
        }).catch(function () {
          somLigado = false;
          tocarMudo();
          atualizarBotao();
          return false;
        });
      }
      somLigado = !audio.muted;
      atualizarBotao();
      return Promise.resolve(somLigado);
    }

    function desligarSom() {
      audio.muted = true;
      somLigado = false;
      atualizarBotao();
    }

    btn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (somLigado && !audio.muted) {
        desligarSom();
      } else {
        ligarSom();
      }
    });

    function iniciarComSom() {
      ligarSom().then(function (ok) {
        if (!ok) {
          /* Navegador bloqueou autoplay com som: libera no 1º toque na página */
          var liberar = function (e) {
            if (e && btn.contains(e.target)) return; /* o próprio botão cuida do clique */
            ligarSom();
            window.removeEventListener("pointerdown", liberar, true);
            window.removeEventListener("keydown", liberar, true);
          };
          window.addEventListener("pointerdown", liberar, true);
          window.addEventListener("keydown", liberar, true);
        }
      });
    }

    audio.addEventListener("canplay", iniciarComSom, { once: true });
    iniciarComSom();
    atualizarBotao();

    window.addEventListener("curtains:open", function () {
      if (!somLigado || audio.muted || audio.paused) {
        ligarSom();
      }
    });
  })();
</script>
{% endblock %}
